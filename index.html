    /* ============================================================================
       5. INITIALIZATION & PERSISTENCE HELPERS
       ============================================================================ */
    function loadPersistedData() {
      try {
        const rawVocab = SafeStorage.getItem(STORAGE_KEYS.VOCAB);
        if (rawVocab) {
          const parsed = JSON.parse(rawVocab);
          state.vocabDeck = Array.isArray(parsed) && parsed.length > 0 ? parsed : [...DEFAULT_VOCAB_DECK];
        } else {
          state.vocabDeck = [...DEFAULT_VOCAB_DECK];
          SafeStorage.setItem(STORAGE_KEYS.VOCAB, JSON.stringify(state.vocabDeck));
        }
      } catch (e) {
        state.vocabDeck = [...DEFAULT_VOCAB_DECK];
      }

      try {
        const rawMistakes = SafeStorage.getItem(STORAGE_KEYS.MISTAKES);
        state.mistakes = rawMistakes ? JSON.parse(rawMistakes) : [];
        if (!Array.isArray(state.mistakes)) state.mistakes = [];
      } catch (e) {
        state.mistakes = [];
      }

      try {
        const rawHistory = SafeStorage.getItem(STORAGE_KEYS.HISTORY);
        state.history = rawHistory ? JSON.parse(rawHistory) : [];
        if (!Array.isArray(state.history)) state.history = [];
      } catch (e) {
        state.history = [];
      }
    }

      SafeStorage.setItem(STORAGE_KEYS.VOCAB, JSON.stringify(state.vocabDeck));
      updateHeaderBadges();
    }

    function saveMistakes() {
      SafeStorage.setItem(STORAGE_KEYS.MISTAKES, JSON.stringify(state.mistakes));

      if (mistakeEl) mistakeEl.textContent = String(state.mistakes.length);

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const navKey = btn.getAttribute('data-nav');
        const active = (state.route === navKey) || (state.route === 'test' && navKey === 'dashboard') || (state.route === 'report' && navKey === 'dashboard');
        btn.className = active
          ? 'nav-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-[#1E3A8A]/10 text-[#1E3A8A] transition-colors flex items-center gap-1.5 cursor-pointer'

      });
    }

    /* ============================================================================
       6. UI UTILITIES (HTML ESCAPING, TOASTS, CUSTOM MODAL, SPEECH)
       ============================================================================ */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-700 text-white border-emerald-600',
        warning: 'bg-amber-700 text-white border-amber-600',
        error: 'bg-rose-700 text-white border-rose-600',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg border text-xs sm:text-sm font-semibold flex items-center gap-2 transition-all duration-300 ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    let modalConfirmCallback = null;

    function openModal({ title, bodyHtml, confirmLabel = '確定', cancelLabel = '取消', confirmVariant = 'primary', onConfirm }) {
      const modal = document.getElementById('custom-modal');
      const titleEl = document.getElementById('modal-title');
      const bodyEl = document.getElementById('modal-body');
      const actionsEl = document.getElementById('modal-actions');
      if (!modal || !titleEl || !bodyEl || !actionsEl) return;

      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHtml;
      modalConfirmCallback = typeof onConfirm === 'function' ? onConfirm : null;

      const btnClass = confirmVariant === 'danger'
        ? 'px-4 py-2 rounded-xl text-sm font-bold bg-rose-600 text-white hover:bg-rose-700 transition-colors cursor-pointer'
        : 'px-4 py-2 rounded-xl text-sm font-bold bg-[#1E3A8A] text-white hover:bg-[#2B4F9E] transition-colors cursor-pointer';

      actionsEl.innerHTML = `
        ${cancelLabel ? `<button type="button" data-action="modal-cancel" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">${escapeHtml(cancelLabel)}</button>` : ''}
        <button type="button" data-action="modal-confirm" class="${btnClass}">${escapeHtml(confirmLabel)}</button>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modalConfirmCallback = null;
    }

    function speakWord(word) {
      if (!word) return;
      if (!HAS_SPEECH) {
        showToast('此瀏覽器環境不支援語音朗讀功能', 'warning');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
      } catch (e) {
        showToast('語音播放發生異常', 'warning');
      }
    }

    function addWordToDeck(vocabObj) {
      if (!vocabObj || !vocabObj.word) return;
      const normalized = vocabObj.word.trim().toLowerCase();
      const exists = state.vocabDeck.some(v => v.word.trim().toLowerCase() === normalized);
      if (exists) {
        showToast(`「${vocabObj.word}」已在單字卡中`, 'info');
        return;
      }
      state.vocabDeck.unshift({
        word: vocabObj.word.trim(),
        pos: vocabObj.pos || 'n./v.',
        zh: vocabObj.zh || '重要詞彙',
        example: vocabObj.example || '',
        mastered: false
      });
      saveVocabDeck();
      showToast(`已將「${vocabObj.word}」加入單字卡！`, 'success');
      if (state.route === 'test' || state.route === 'report') {
        renderApp();
      }
    }

    /* ============================================================================
       7. TEST SESSION ENGINE (START, TIMER, ANSWER, FLAG, SUBMIT, SCORING)
       ============================================================================ */
    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function startTimer() {
      stopTimer();
      state.timerInterval = setInterval(() => {
        if (!state.session || state.session.paused || state.route !== 'test') return;
        if (state.session.secondsLeft > 0) {
          state.session.secondsLeft -= 1;
          updateTimerDOM();
          if (state.session.secondsLeft === 0) {
            stopTimer();
            showToast('測驗時間到，系統已自動交卷！', 'warning');
            finalizeTestSubmission();
          }
        }
      }, 1000);
    }

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateTimerDOM() {
      const el = document.getElementById('test-timer-display');
      if (!el || !state.session) return;
      el.textContent = formatTime(state.session.secondsLeft);
      if (state.session.secondsLeft <= 300) {
        el.classList.add('text-rose-600', 'timer-urgent');
        el.classList.remove('text-[#1E3A8A]');
      } else {
        el.classList.remove('text-rose-600', 'timer-urgent');
        el.classList.add('text-[#1E3A8A]');
      }
    }

    function startTestSession({ title, questions, passages, durationMinutes, instantFeedback, isOfficialFull = false }) {
      if (!questions || questions.length === 0) {
        showToast('目前沒有可用的題目', 'warning');
        return;
      }
      stopTimer();
      const passageMap = {};
      (passages || []).forEach(p => {
        passageMap[p.id] = p;
      });

      state.session = {
        title,
        questions,
        passageMap,
        currentIndex: 0,
        answers: {}, // { [questionId]: optionIndex }
        revealed: {}, // { [questionId]: true } (for instant feedback mode)
        flagged: {},  // { [questionId]: true }
        durationSeconds: durationMinutes * 60,
        secondsLeft: durationMinutes * 60,
        paused: false,
        instantFeedback: Boolean(instantFeedback),
        isOfficialFull: Boolean(isOfficialFull),
        startedAt: Date.now()
      };
      state.drawerOpen = false;
      state.route = 'test';
      startTimer();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startOfficialFullMock() {
      startTestSession({
        title: '全真模擬測驗 (40 題完整版)',
        questions: OFFICIAL_QUESTIONS,
        passages: OFFICIAL_PASSAGES,
        durationMinutes: 45,
        instantFeedback: false,
        isOfficialFull: true
      });
    }

    function startPartPractice(partNum) {
      const partNames = {
        1: '第一部分：詞彙和結構 (Q1–15)',
        2: '第二部分：段落填空 (Q16–25)',
        3: '第三部分：閱讀理解 (Q26–40)'
      };
      const durations = { 1: 12, 2: 12, 3: 21 };
      const qs = OFFICIAL_QUESTIONS.filter(q => q.part === partNum);
      startTestSession({
        title: partNames[partNum],
        questions: qs,
        passages: OFFICIAL_PASSAGES,
        durationMinutes: durations[partNum],
        instantFeedback: state.practiceInstantMode,
        isOfficialFull: false
      });
    }

    function startMistakeDrill() {
      if (state.mistakes.length === 0) {
        showToast('錯題本目前是空的，太棒了！', 'info');
        return;
      }
      const neededPassageIds = new Set(state.mistakes.map(q => q.passageId).filter(Boolean));
      const passages = OFFICIAL_PASSAGES.filter(p => neededPassageIds.has(p.id));
      startTestSession({
        title: `錯題強化複習 (${state.mistakes.length} 題)`,
        questions: [...state.mistakes],
        passages,
        durationMinutes: Math.max(5, Math.ceil(state.mistakes.length * 1.2)),
        instantFeedback: true,
        isOfficialFull: false
      });
    }

    function selectAnswerOption(optionIdx) {
      if (!state.session) return;
      const q = state.session.questions[state.session.currentIndex];
      if (!q) return;

      // In instant feedback mode, lock once revealed
      if (state.session.instantFeedback && state.session.revealed[q.id]) {
        return;
      }

      state.session.answers[q.id] = optionIdx;
      if (state.session.instantFeedback) {
        state.session.revealed[q.id] = true;
      }
      renderApp();
    }

    function toggleFlagCurrent() {
      if (!state.session) return;
      const q = state.session.questions[state.session.currentIndex];
      if (!q) return;
      if (state.session.flagged[q.id]) {
        delete state.session.flagged[q.id];
      } else {
        state.session.flagged[q.id] = true;
      }
      renderApp();
    }

    function jumpToQuestionIndex(idx) {
      if (!state.session) return;
      if (idx < 0 || idx >= state.session.questions.length) return;
      state.session.currentIndex = idx;
      state.drawerOpen = false;
      renderApp();
    }

    function jumpToQuestionById(qId) {
      if (!state.session) return;
      const idx = state.session.questions.findIndex(q => String(q.id) === String(qId));
      if (idx !== -1) {
        jumpToQuestionIndex(idx);
      }
    }

    function requestSubmitTest() {
      if (!state.session) return;
      const total = state.session.questions.length;
      const answeredCount = state.session.questions.filter(q => state.session.answers[q.id] !== undefined).length;
      const unanswered = total - answeredCount;

      openModal({
        title: '確認交卷並計算成績？',
        bodyHtml: unanswered > 0
          ? `<p>您目前已完成 <strong class="text-slate-900">${answeredCount} / ${total}</strong> 題，尚有 <strong class="text-rose-600">${unanswered} 題未作答</strong>。交卷後將立即顯示分數報告與逐題詳解。</p>`
          : `<p>太棒了！您已完成全部 <strong class="text-emerald-700">${total} 題</strong> 作答。確定現在交卷並查看成績分析嗎？</p>`,
        confirmLabel: '確認交卷',
        cancelLabel: '繼續作答',
        confirmVariant: 'primary',
        onConfirm: () => {
          closeModal();
          finalizeTestSubmission();
        }
      });
    }

    function finalizeTestSubmission() {
      if (!state.session) return;
      stopTimer();

      const sess = state.session;
      let correctCount = 0;
      const partStats = {
        1: { correct: 0, total: 0 },
        2: { correct: 0, total: 0 },
        3: { correct: 0, total: 0 }
      };

      const existingMistakeIds = new Set(state.mistakes.map(m => String(m.id)));
      let newlyAddedMistakes = 0;

      sess.questions.forEach(q => {
        const userAns = sess.answers[q.id];
        const isCorrect = userAns === q.correct;
        if (partStats[q.part]) {
          partStats[q.part].total += 1;
          if (isCorrect) partStats[q.part].correct += 1;
        }
        if (isCorrect) {
          correctCount += 1;
        } else {
          // Record missed question into Mistake Bank (avoid duplicates)
          if (!existingMistakeIds.has(String(q.id))) {
            // Attach passage data if needed for standalone review
            const passageObj = q.passageId ? sess.passageMap[q.passageId] : null;
            state.mistakes.unshift({
              ...q,
              _savedPassage: passageObj || q._savedPassage || null
            });
            existingMistakeIds.add(String(q.id));
            newlyAddedMistakes += 1;
          }
        }
      });

      if (newlyAddedMistakes > 0) {
        saveMistakes();
      }

      const total = sess.questions.length;
      const percentage = Math.round((correctCount / total) * 100);
      // GEPT Intermediate Reading Scaled Score: 0 to 120 (Passing benchmark = 72)
      const scaledScore = Math.round((correctCount / total) * 120);
      const passed = scaledScore >= 72;
      const elapsedSeconds = Math.max(1, sess.durationSeconds - sess.secondsLeft);

      const report = {
        title: sess.title,
        questions: sess.questions,
        passageMap: sess.passageMap,
        answers: { ...sess.answers },
        flagged: { ...sess.flagged },
        correctCount,
        total,
        percentage,
        scaledScore,
        passed,
        partStats,
        elapsedSeconds,
        newlyAddedMistakes,
        isOfficialFull: sess.isOfficialFull
      };

      state.history.unshift({
        date: new Date().toLocaleDateString('zh-TW'),
        title: sess.title,
        correctCount,
        total,
        scaledScore,
        passed
      });
      if (state.history.length > 15) state.history.length = 15;
      saveHistory();

      state.lastReport = report;
      state.reportFilter = 'all';
      state.session = null;
      state.route = 'report';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ============================================================================
       8. GEMINI API INFINITE PRACTICE GENERATOR (WITH STRICT JSON VALIDATION)
       ============================================================================ */
    async function generateAIQuestions() {
      if (state.aiLoading) return;
      state.aiLoading = true;
      state.aiError = null;
      renderApp();

      const part = Number(state.aiConfig.part) || 1;
      const theme = state.aiConfig.theme;

      const partSpec = part === 1
        ? 'Generate 5 standalone GEPT Intermediate (CEFR B1) Part 1 Vocabulary & Structure multiple-choice questions. Set passage to null.'
        : part === 2
          ? 'Generate 1 GEPT Intermediate (CEFR B1) Part 2 Cloze passage (150-190 words) with 5 numbered blanks written literally as [[1]], [[2]], [[3]], [[4]], [[5]] inside the passage text, and 5 corresponding multiple-choice questions (blankNumber 1 to 5).'
          : 'Generate 1 GEPT Intermediate (CEFR B1) Part 3 Reading Comprehension passage (180-230 words, realistic article/email/notice) and 3 multiple-choice comprehension questions testing main idea, detail, and inference.';

      const systemPrompt = `You are an expert test writer for Taiwan's GEPT Intermediate (全民英檢中級, CEFR B1) Reading Test.
Output ONLY valid JSON matching the schema. Every question must have 4 plausible options, an exact 0-based "correct" integer (0, 1, 2, or 3), a clear bilingual explanation (English + Traditional Chinese 繁體中文), and 1-2 useful B1 vocabulary entries.`;

      const userQuery = `Theme: ${theme}.
Task: ${partSpec}
Ensure strict grammatical accuracy and authentic Taiwan GEPT Intermediate difficulty.`;

      const apiKey = (typeof window !== 'undefined' && window.GEMINI_API_KEY) ? window.GEMINI_API_KEY : '';
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const payload = {
        contents: [{ parts: [{ text: userQuery }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'OBJECT',
            properties: {
              passageTitle: { type: 'STRING' },
              passageText: { type: 'STRING' },
              questions: {
                type: 'ARRAY',
                items: {
                  type: 'OBJECT',
                  properties: {
                    blankNumber: { type: 'INTEGER' },
                    stem: { type: 'STRING' },
                    options: { type: 'ARRAY', items: { type: 'STRING' } },
                    correct: { type: 'INTEGER' },
                    explanation: { type: 'STRING' },
                    vocab: {
                      type: 'ARRAY',
                      items: {
                        type: 'OBJECT',
                        properties: {
                          word: { type: 'STRING' },
                          pos: { type: 'STRING' },
                          zh: { type: 'STRING' },
                          example: { type: 'STRING' }
                        },
                        required: ['word', 'pos', 'zh', 'example']
                      }
                    }
                  },
                  required: ['stem', 'options', 'correct', 'explanation', 'vocab']
                }
              }
            },
            required: ['questions']
          }
        }
      };

      const maxRetries = 3;
      let lastErr = null;

      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errText = await response.text().catch(() => '');
            throw new Error(`HTTP ${response.status}: ${errText.slice(0, 140) || 'API 請求失敗'}`);
          }

          const data = await response.json();
          const rawJsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawJsonText) {
            throw new Error('AI 回傳內容為空，請重試。');
          }

          const parsed = JSON.parse(rawJsonText);
          if (!parsed || !Array.isArray(parsed.questions) || parsed.questions.length === 0) {
            throw new Error('AI 題目格式驗證失敗，請重新產生。');
          }

          const batchId = `ai_${Date.now()}`;
          const hasPassage = (part === 2 || part === 3) && parsed.passageText && parsed.passageText.trim().length > 20;
          const passageObj = hasPassage ? {
            id: batchId,
            part,
            title: parsed.passageTitle || `AI Generated ${theme}`,
            subtitle: `AI 智慧生成題組 • ${theme}`,
            content: parsed.passageText.trim()
          } : null;

          const normalizedQuestions = parsed.questions.map((q, idx) => {
            const opts = Array.isArray(q.options) && q.options.length === 4
              ? q.options.map(o => String(o))
              : ['Option A', 'Option B', 'Option C', 'Option D'];
            const corr = Number.isInteger(q.correct) && q.correct >= 0 && q.correct <= 3 ? q.correct : 0;
            return {
              id: `${batchId}_q${idx + 1}`,
              part,
              passageId: passageObj ? passageObj.id : null,
              blankNumber: part === 2 ? (q.blankNumber || idx + 1) : null,
              stem: String(q.stem || `Question ${idx + 1}`),
              options: opts,
              correct: corr,
              explanation: String(q.explanation || 'AI 生成解析'),
              vocab: Array.isArray(q.vocab) ? q.vocab : []
            };
          });

          state.aiGeneratedSet = {
            part,
            theme,
            passage: passageObj,
            questions: normalizedQuestions
          };
          state.aiLoading = false;
          state.aiError = null;
          renderApp();
          showToast(`成功生成 ${normalizedQuestions.length} 題 GEPT 中級題組！`, 'success');
          return;
        } catch (err) {
          lastErr = err;
          if (attempt < maxRetries - 1) {
            await new Promise(res => setTimeout(res, 1000 * Math.pow(2, attempt)));
          }
        }
      }

      state.aiLoading = false;
      state.aiError = `無法連線至 Gemini AI 服務（${lastErr ? lastErr.message : '網路或金鑰限制'}）。您仍可隨時使用內建 40 題全真模擬題庫進行練習！`;
      renderApp();
    }

    /* ============================================================================
       9. PASSAGE RENDERING WITH INTERACTIVE CLOZE CHIPS
       ============================================================================ */
    function renderFormattedPassage(passage, activeBlankNumber, revealedMap, answersMap, questionsList) {
      if (!passage) return '';
      const fontSizeClass = state.passageFontSize === 'sm'
        ? 'text-sm sm:text-[15px]'
        : state.passageFontSize === 'lg'
          ? 'text-lg sm:text-[19px]'
          : 'text-base sm:text-[17px]';

      const paragraphs = passage.content.split(/\n\n+/);
      const htmlParagraphs = paragraphs.map(para => {
        let escaped = escapeHtml(para).replace(/\n/g, '<br>');
        // Replace [[16]]..[[25]] or [[1]]..[[5]] with interactive blank buttons
        escaped = escaped.replace(/\[\[(\d+)\]\]/g, (_, numStr) => {
          const blankNum = Number(numStr);
          const qObj = (questionsList || []).find(q => Number(q.blankNumber) === blankNum);
          const isCurrent = Number(activeBlankNumber) === blankNum;
          const userAns = qObj && answersMap ? answersMap[qObj.id] : undefined;
          const isRevealed = qObj && revealedMap ? Boolean(revealedMap[qObj.id]) : false;

          let labelText = `[ ${blankNum} ]`;
          let chipStyle = 'bg-slate-100 text-slate-800 border-slate-300 hover:border-[#1E3A8A]';

          if (userAns !== undefined && qObj && qObj.options[userAns]) {
            labelText = `${blankNum}. ${escapeHtml(qObj.options[userAns])}`;
            if (isRevealed) {
              chipStyle = userAns === qObj.correct
                ? 'bg-emerald-100 text-emerald-900 border-emerald-500 font-bold'
                : 'bg-rose-100 text-rose-900 border-rose-500 font-bold line-through';
            } else {
              chipStyle = 'bg-[#1E3A8A]/10 text-[#1E3A8A] border-[#1E3A8A]/40 font-semibold';
            }
          }

          if (isCurrent) {
            chipStyle = 'bg-[#1E3A8A] text-white border-[#1E3A8A] font-bold shadow-xs ring-2 ring-[#1E3A8A]/25';
          }

          return `<button type="button" data-action="jump-blank" data-blank="${blankNum}" class="inline-flex items-center px-2.5 py-0.5 mx-0.5 rounded-lg border text-sm font-sans transition-all cursor-pointer align-baseline ${chipStyle}">${labelText}</button>`;
        });

        return `<p class="mb-4 last:mb-0">${escaped}</p>`;
      }).join('');

      return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 sm:p-7">
          <div class="border-b border-slate-100 pb-3.5 mb-5">
            <span class="inline-block text-[11px] font-bold uppercase tracking-wider text-[#1E3A8A] bg-[#1E3A8A]/10 px-2.5 py-1 rounded-md mb-2">${escapeHtml(passage.subtitle || `Part ${passage.part} Reading Passage`)}</span>
            <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 leading-snug">${escapeHtml(passage.title)}</h2>
          </div>
          <div class="passage-serif text-slate-800 ${fontSizeClass}">
            ${htmlParagraphs}
          </div>
        </div>
      `;
    }

      const idx = sess.currentIndex;
      const q = sess.questions[idx];
      const passage = q.passageId ? sess.passageMap[q.passageId] : null;
      const userAns = sess.answers[q.id];
      const isRevealed = sess.instantFeedback && Boolean(sess.revealed[q.id]);
      const isFlagged = Boolean(sess.flagged[q.id]);
      const answeredCount = sess.questions.filter(item => sess.answers[item.id] !== undefined).length;
      const letters = ['A', 'B', 'C', 'D'];

      // Part Quick-Jump Tabs (if multiple parts exist)
      const partsPresent = [1, 2, 3].filter(p => sess.questions.some(item => item.part === p));
      const partTabsHtml = partsPresent.length > 1
        ? `<div class="flex items-center gap-1.5">
            ${partsPresent.map(p => {
              const active = q.part === p;
              return `<button type="button" data-action="jump-part" data-part="${p}" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-colors cursor-pointer ${active ? 'bg-[#1E3A8A] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Part ${p}</button>`;
            }).join('')}
          </div>`
        : '';

      // Question Navigator Grid
      const gridButtonsHtml = sess.questions.map((item, i) => {
        const isCurrent = i === idx;
        const ans = sess.answers[item.id];
        const flag = Boolean(sess.flagged[item.id]);
        const rev = sess.instantFeedback && Boolean(sess.revealed[item.id]);

        let cls = 'bg-slate-100 text-slate-700 border-slate-200 hover:border-slate-400';
        if (rev) {
          cls = ans === item.correct
            ? 'bg-emerald-600 text-white border-emerald-600'
            : 'bg-rose-600 text-white border-rose-600';
        } else if (ans !== undefined) {
          cls = 'bg-[#1E3A8A]/15 text-[#1E3A8A] border-[#1E3A8A]/40 font-bold';
        }
        if (isCurrent) {
          cls += ' ring-2 ring-[#1E3A8A] ring-offset-1 font-extrabold';
        }

        const displayNum = item.blankNumber || (typeof item.id === 'number' ? item.id : i + 1);
        return `
          <button type="button" data-action="jump-index" data-index="${i}" class="relative h-9 rounded-lg border text-xs transition-all flex items-center justify-center cursor-pointer ${cls}">
            <span>${displayNum}</span>
            ${flag ? '<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-500 border border-white"></span>' : ''}
          </button>
        `;
      }).join('');

      // Options Rendering
      const optionsHtml = q.options.map((optText, optIdx) => {
        const selected = userAns === optIdx;
        let cardCls = 'border-slate-200 bg-white hover:border-[#1E3A8A]/50 hover:bg-slate-50';
        let badgeCls = 'bg-slate-100 text-slate-700';
        let statusTag = '';

        if (isRevealed) {
          if (optIdx === q.correct) {
            cardCls = 'border-emerald-500 bg-emerald-50/80 text-emerald-950';
            badgeCls = 'bg-emerald-600 text-white';
            statusTag = '<span class="text-xs font-extrabold text-emerald-700 ml-auto">✓ 正確答案</span>';
          } else if (selected) {
            cardCls = 'border-rose-500 bg-rose-50/80 text-rose-950';
            badgeCls = 'bg-rose-600 text-white';
            statusTag = '<span class="text-xs font-extrabold text-rose-700 ml-auto">✗ 您的選擇</span>';
          } else {
            cardCls = 'border-slate-200 bg-slate-50/60 opacity-70';
          }
        } else if (selected) {
          cardCls = 'border-[#1E3A8A] bg-[#1E3A8A]/5 text-slate-900 shadow-2xs';
          badgeCls = 'bg-[#1E3A8A] text-white';
        }

        return `
          <button type="button" data-action="select-option" data-option="${optIdx}" ${isRevealed ? 'disabled' : ''} class="w-full text-left p-3.5 sm:p-4 rounded-xl border-2 transition-all flex items-center gap-3.5 ${isRevealed ? 'cursor-default' : 'cursor-pointer'} ${cardCls}">
            <span class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-extrabold shrink-0 transition-colors ${badgeCls}">
              ${letters[optIdx]}
            </span>
            <span class="text-sm sm:text-base font-medium leading-snug">${escapeHtml(optText)}</span>
            ${statusTag}
          </button>
        `;
      }).join('');

      // Instant Feedback Explanation Drawer
      const instantExplanationHtml = isRevealed
        ? `
          <div class="mt-6 rounded-2xl border ${userAns === q.correct ? 'border-emerald-200 bg-emerald-50/70' : 'border-amber-200 bg-amber-50/70'} p-5 space-y-3">
            <div class="flex items-center gap-2 font-extrabold text-sm ${userAns === q.correct ? 'text-emerald-800' : 'text-amber-900'}">
              <span>${userAns === q.correct ? '🎉 答對了！解析如下：' : '💡 解析與重點提示：'}</span>
            </div>
            <p class="text-sm text-slate-800 whitespace-pre-line leading-relaxed">${escapeHtml(q.explanation)}</p>
            ${(q.vocab && q.vocab.length > 0) ? `
              <div class="pt-2 border-t border-slate-200/70 flex flex-wrap gap-2">
                ${q.vocab.map((v, vIdx) => `
                  <button type="button" data-action="save-question-vocab" data-vidx="${vIdx}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:border-[#1E3A8A] text-xs font-bold text-slate-800 shadow-2xs cursor-pointer">
                    <span class="text-[#1E3A8A]">+ 單字卡</span>
                    <span>${escapeHtml(v.word)}</span>
                    <span class="text-slate-500 font-normal">(${escapeHtml(v.zh)})</span>
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `
        : '';

      const questionCardHtml = `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 sm:p-7 flex flex-col justify-between">
          <div>
            <!-- Question Header Meta -->
            <div class="flex items-center justify-between gap-2 pb-4 mb-5 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-lg bg-[#1E3A8A] text-white text-xs font-extrabold">
                  第 ${idx + 1} / ${total} 題
                </span>
                <span class="text-xs font-semibold text-slate-500">
                  Part ${q.part} ${q.blankNumber ? `• 空格 [${q.blankNumber}]` : ''}
                </span>
              </div>
              <button type="button" data-action="toggle-flag" class="px-3 py-1.5 rounded-xl border text-xs font-bold flex items-center gap-1.5 transition-colors cursor-pointer ${isFlagged ? 'bg-amber-50 border-amber-400 text-amber-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
                <span>${isFlagged ? '🚩 已標記複查' : '🏳️ 標記此題'}</span>
              </button>
            </div>

            <!-- Question Stem -->
            <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-5">
              ${escapeHtml(q.stem)}
            </h3>

            <!-- 4 Choices -->
            <div class="space-y-3">
              ${optionsHtml}
            </div>

            ${instantExplanationHtml}
          </div>

          <!-- Bottom Prev / Next Controls -->
          <div class="mt-8 pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
            <button type="button" data-action="prev-question" ${idx === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors cursor-pointer">
              ← 上一題
            </button>

            <span class="hidden sm:inline text-xs text-slate-400">
              快捷鍵：1–4 / A–D 作答 • ←/→ 換題 • F 標記
            </span>

            ${idx < total - 1
              ? `<button type="button" data-action="next-question" class="px-5 py-2.5 rounded-xl bg-[#1E3A8A] hover:bg-[#2B4F9E] text-white text-sm font-bold transition-colors cursor-pointer">
                  下一題 →
                </button>`
              : `<button type="button" data-action="submit-test" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-extrabold shadow-xs transition-colors cursor-pointer">
                  完成並交卷 ✓
                </button>`
            }
          </div>
        </div>
      `;

      return `
        <div class="space-y-5">
          <!-- Sticky Test Control Bar -->
          <div class="bg-white rounded-2xl border border-slate-200 p-3.5 sm:px-5 shadow-2xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button type="button" data-action="go-home" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors cursor-pointer">
                ← 離開測驗
              </button>
              <div>
                <h2 class="text-sm sm:text-base font-extrabold text-slate-900">${escapeHtml(sess.title)}</h2>
                <p class="text-[11px] text-slate-500">已作答 ${answeredCount} / ${total} 題 • ${sess.instantFeedback ? '即時解析模式' : '正式模擬考模式'}</p>
              </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
              ${partTabsHtml}

              <!-- Passage Font Size Switcher -->
              <div class="hidden md:inline-flex items-center bg-slate-100 rounded-xl p-0.5 border border-slate-200" title="文章字體大小">
                <button type="button" data-action="set-font" data-size="sm" class="px-2 py-1 rounded-lg text-xs font-bold cursor-pointer ${state.passageFontSize === 'sm' ? 'bg-white text-[#1E3A8A] shadow-2xs' : 'text-slate-600'}">A-</button>
                <button type="button" data-action="set-font" data-size="base" class="px-2 py-1 rounded-lg text-xs font-bold cursor-pointer ${state.passageFontSize === 'base' ? 'bg-white text-[#1E3A8A] shadow-2xs' : 'text-slate-600'}">A</button>
                <button type="button" data-action="set-font" data-size="lg" class="px-2 py-1 rounded-lg text-xs font-bold cursor-pointer ${state.passageFontSize === 'lg' ? 'bg-white text-[#1E3A8A] shadow-2xs' : 'text-slate-600'}">A+</button>
              </div>

              <!-- Timer -->
              <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="test-timer-display" class="font-mono text-sm sm:text-base font-extrabold ${sess.secondsLeft <= 300 ? 'text-rose-600 timer-urgent' : 'text-[#1E3A8A]'}">
                  ${formatTime(sess.secondsLeft)}
                </span>
                ${!sess.isOfficialFull ? `
                  <button type="button" data-action="toggle-pause" class="ml-1 text-[11px] font-bold px-1.5 py-0.5 rounded bg-slate-200 hover:bg-slate-300 text-slate-700 cursor-pointer">
                    ${sess.paused ? '繼續' : '暫停'}
                  </button>
                ` : ''}
              </div>

              <!-- Mobile Grid Toggle -->
              <button type="button" data-action="toggle-drawer" class="lg:hidden px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-50 cursor-pointer">
                題號卡 (${answeredCount}/${total})
              </button>

              <!-- Submit Button -->
              <button type="button" data-action="submit-test" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-extrabold shadow-2xs transition-colors cursor-pointer">
                交卷
              </button>
            </div>
          </div>

          <!-- Paused Overlay Notice -->
          ${sess.paused ? `
            <div class="bg-amber-50 border border-amber-300 rounded-2xl p-4 flex items-center justify-between">
              <span class="text-sm font-bold text-amber-900">⏸ 計時器已暫停，點擊右側按鈕恢復練習。</span>
              <button type="button" data-action="toggle-pause" class="px-4 py-1.5 rounded-xl bg-amber-600 text-white text-xs font-bold cursor-pointer">繼續計時</button>
            </div>
          ` : ''}

          <!-- Main Split-Pane Workspace + Navigator Sidebar -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            ${passage ? `
              <!-- Left Sticky Passage Pane (Parts 2 & 3) -->
              <div class="lg:col-span-6 lg:sticky lg:top-20 lg:max-h-[calc(100vh-6.5rem)] lg:overflow-y-auto custom-scrollbar">
                ${renderFormattedPassage(passage, q.blankNumber, sess.revealed, sess.answers, sess.questions)}
              </div>
              <!-- Right Question Pane -->
              <div class="lg:col-span-4">
                ${questionCardHtml}
              </div>
            ` : `
              <!-- Standalone Question Pane (Part 1) -->
              <div class="lg:col-span-9">
                ${questionCardHtml}
              </div>
            `}

            <!-- Question Navigator Card (Desktop Sidebar / Mobile Expandable) -->
            <aside class="${passage ? 'lg:col-span-2' : 'lg:col-span-3'} ${state.drawerOpen ? 'block' : 'hidden lg:block'} bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs lg:sticky lg:top-20">
              <div class="flex items-center justify-between mb-3">
                <h4 class="text-xs font-extrabold uppercase tracking-wider text-slate-700">作答題號總覽</h4>
                <span class="text-xs font-bold text-[#1E3A8A]">${answeredCount}/${total}</span>
              </div>
              <div class="grid ${passage ? 'grid-cols-5 lg:grid-cols-4' : 'grid-cols-5'} gap-1.5 max-h-80 overflow-y-auto custom-scrollbar pr-0.5">
                ${gridButtonsHtml}
              </div>
              <div class="mt-4 pt-3 border-t border-slate-100 grid grid-cols-2 gap-1.5 text-[11px] text-slate-500">
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-[#1E3A8A]/20 border border-[#1E3A8A]"></span>已作答</div>
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-slate-100 border border-slate-300"></span>未作答</div>
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>已標記</div>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function renderScoreReportView() {
      const rep = state.lastReport;
      if (!rep) return renderDashboardView();

      const letters = ['A', 'B', 'C', 'D'];
      const filteredQuestions = rep.questions.filter(q => {
        if (state.reportFilter === 'wrong') return rep.answers[q.id] !== q.correct;
        if (state.reportFilter === 'flagged') return Boolean(rep.flagged[q.id]);
        return true;
      });

      const partBarsHtml = [1, 2, 3].filter(p => rep.partStats[p].total > 0).map(p => {
        const st = rep.partStats[p];
        const pct = Math.round((st.correct / st.total) * 100);
        const names = { 1: 'Part 1 詞彙和結構', 2: 'Part 2 段落填空', 3: 'Part 3 閱讀理解' };
        return `
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/80">
            <div class="flex items-center justify-between text-xs font-bold mb-2">
              <span class="text-slate-800">${names[p]}</span>
              <span class="text-[#1E3A8A]">${st.correct} / ${st.total} (${pct}%)</span>
            </div>
            <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
              <div class="h-full rounded-full ${pct >= 60 ? 'bg-emerald-600' : 'bg-amber-500'}" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const reviewListHtml = filteredQuestions.length === 0
        ? `<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-slate-500 text-sm">此篩選條件下沒有題目。</div>`
        : filteredQuestions.map(q => {
            const globalIdx = rep.questions.findIndex(item => item.id === q.id);
            const userAns = rep.answers[q.id];
            const isCorrect = userAns === q.correct;
            const passage = q.passageId ? rep.passageMap[q.passageId] : null;

            return `
              <article class="bg-white rounded-2xl border ${isCorrect ? 'border-slate-200' : 'border-rose-200'} p-5 sm:p-6 shadow-2xs space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                      ${isCorrect ? '✓ 正確' : '✗ 錯誤'} • 第 ${globalIdx + 1} 題 (Part ${q.part})
                    </span>
                    ${rep.flagged[q.id] ? '<span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">🚩 已標記</span>' : ''}
                  </div>
                  <span class="text-xs text-slate-500">
                    您的作答：<strong>${userAns !== undefined ? letters[userAns] : '未作答'}</strong> ｜ 正確答案：<strong class="text-emerald-700">${letters[q.correct]}</strong>
                  </span>
                </div>

                ${passage ? `
                  <details class="bg-slate-50 rounded-xl border border-slate-200 p-3.5 text-xs">
                    <summary class="font-bold text-[#1E3A8A] cursor-pointer">展開閱讀原文：${escapeHtml(passage.title)}</summary>
                    <div class="mt-3 pt-3 border-t border-slate-200 passage-serif text-sm text-slate-700 whitespace-pre-line leading-relaxed">
                      ${escapeHtml(passage.content)}
                    </div>
                  </details>
                ` : ''}

                <p class="text-base font-bold text-slate-900">${escapeHtml(q.stem)}</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${q.options.map((opt, oIdx) => {
                    let cls = 'border-slate-200 bg-slate-50 text-slate-700';
                    if (oIdx === q.correct) cls = 'border-emerald-500 bg-emerald-50 text-emerald-950 font-bold';
                    else if (oIdx === userAns) cls = 'border-rose-400 bg-rose-50 text-rose-900 line-through';
                    return `<div class="px-3.5 py-2.5 rounded-xl border text-sm flex items-center gap-2 ${cls}">
                      <span class="font-extrabold">${letters[oIdx]}.</span>
                      <span>${escapeHtml(opt)}</span>
                    </div>`;
                  }).join('')}
                </div>

                <div class="bg-blue-50/60 border border-blue-100 rounded-xl p-4 space-y-2.5">
                  <p class="text-xs font-extrabold text-[#1E3A8A]">雙語詳細解析</p>
                  <p class="text-sm text-slate-800 whitespace-pre-line leading-relaxed">${escapeHtml(q.explanation)}</p>
                  ${(q.vocab && q.vocab.length > 0) ? `
                    <div class="pt-2 flex flex-wrap gap-2">
                      ${q.vocab.map((v, vIdx) => `
                        <button type="button" data-action="save-report-vocab" data-qid="${escapeHtml(String(q.id))}" data-vidx="${vIdx}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-white border border-slate-200 hover:border-[#1E3A8A] text-xs font-bold text-slate-800 cursor-pointer">
                          <span class="text-[#1E3A8A]">+ 加入單字卡</span>
                          <span>${escapeHtml(v.word)}</span>
                          <span class="text-slate-500 font-normal">(${escapeHtml(v.zh)})</span>
                        </button>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              </article>
            `;
          }).join('');

      return `
        <div class="space-y-7">
          <!-- Score Summary Banner -->
          <section class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-xs">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
              <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-extrabold ${rep.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} mb-3">
                  <span>${rep.passed ? '🎉 恭喜達成中級通過標準 (≥ 72 分)' : '📈 尚未達 72 分標準，建議複習錯題後再戰'}</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${escapeHtml(rep.title)} — 成績分析報告</h1>
                <p class="text-sm text-slate-500 mt-1">
                  作答耗時：${formatTime(rep.elapsedSeconds)} • 答對題數：${rep.correctCount} / ${rep.total} 題 (${rep.percentage}%)
                  ${rep.newlyAddedMistakes > 0 ? `• 已自動將 ${rep.newlyAddedMistakes} 題錯題收錄至錯題本` : ''}
                </p>
              </div>

              <!-- Scaled Score Card -->
              <div class="flex items-center gap-5 bg-slate-50 border border-slate-200 rounded-2xl p-5 shrink-0">
                <div class="text-center">
                  <div class="text-xs font-bold text-slate-500">GEPT 換算級分</div>
                  <div class="text-4xl font-extrabold ${rep.passed ? 'text-emerald-600' : 'text-[#1E3A8A]'} mt-1">
                    ${rep.scaledScore}<span class="text-base font-bold text-slate-400"> / 120</span>
                  </div>
                  <div class="text-[11px] font-semibold text-slate-500 mt-1">及格門檻：72 分</div>
                </div>
                <div class="h-14 w-px bg-slate-200"></div>
                <div class="flex flex-col gap-2">
                  <button type="button" data-action="start-full-mock" class="px-4 py-2 rounded-xl bg-[#1E3A8A] hover:bg-[#2B4F9E] text-white text-xs font-bold cursor-pointer">
                    再測一次全真模擬
                  </button>
                  <button type="button" data-action="navigate" data-route="mistakes" class="px-4 py-2 rounded-xl bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold cursor-pointer">
                    前往錯題本 (${state.mistakes.length})
                  </button>
                </div>
              </div>
            </div>

            <!-- Part Breakdown -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
              ${partBarsHtml}
            </div>
          </section>

          <!-- Filterable Review Header -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h2 class="text-lg font-extrabold text-slate-900">逐題詳解與解析檢視</h2>
            <div class="inline-flex bg-white border border-slate-200 rounded-xl p-1">
              <button type="button" data-action="set-report-filter" data-filter="all" class="px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer ${state.reportFilter === 'all' ? 'bg-[#1E3A8A] text-white' : 'text-slate-600'}">

    function renderApp() {
      updateHeaderBadges();
      const root = document.getElementById('app-root');
      if (!root) return;

      switch (state.route) {
        case 'test':
          root.innerHTML = renderTestRunnerView();
          break;
        case 'report':
          root.innerHTML = renderScoreReportView();
          break;
        case 'ai-generator':
          root.innerHTML = renderAIGeneratorView();
          break;
        case 'vocab':
          root.innerHTML = renderVocabView();
          break;
        case 'mistakes':
          root.innerHTML = renderMistakesView();
          break;
        case 'dashboard':
        default:
          root.innerHTML = renderDashboardView();
          break;
      }
    }

    /* ============================================================================
       12. GLOBAL EVENT DELEGATION & KEYBOARD SHORTCUTS
       ============================================================================ */
    function handleNavigate(targetRoute) {
      if (state.route === 'test' && state.session) {
        openModal({
          title: '確定要離開目前的測驗嗎？',
          bodyHtml: '<p>離開測驗將會遺失目前的作答進度，確定要返回嗎？</p>',
          confirmLabel: '確定離開',
          cancelLabel: '繼續作答',
          confirmVariant: 'danger',
          onConfirm: () => {
            closeModal();
            stopTimer();
            state.session = null;
            state.route = targetRoute;
            renderApp();
          }
        });
        return;
      }
      state.route = targetRoute;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'modal-cancel':
          closeModal();
          break;
        case 'modal-confirm':
          if (typeof modalConfirmCallback === 'function') modalConfirmCallback();
          else closeModal();
          break;
        case 'go-home':
          handleNavigate('dashboard');
          break;
        case 'navigate':
          handleNavigate(btn.getAttribute('data-route') || 'dashboard');
          break;
        case 'start-full-mock':
          startOfficialFullMock();
          break;
        case 'set-practice-mode':
          state.practiceInstantMode = btn.getAttribute('data-instant') === 'true';
          renderApp();
          break;
        case 'start-part':
          startPartPractice(Number(btn.getAttribute('data-part')));
          break;
        case 'select-option':
          selectAnswerOption(Number(btn.getAttribute('data-option')));
          break;
        case 'toggle-flag':
          toggleFlagCurrent();
          break;
        case 'prev-question':
          if (state.session) jumpToQuestionIndex(state.session.currentIndex - 1);
          break;
        case 'next-question':
          if (state.session) jumpToQuestionIndex(state.session.currentIndex + 1);
          break;
        case 'jump-index':
          jumpToQuestionIndex(Number(btn.getAttribute('data-index')));
          break;
        case 'jump-blank': {
          if (!state.session) break;
          const blankNum = Number(btn.getAttribute('data-blank'));
          const targetIdx = state.session.questions.findIndex(q => Number(q.blankNumber) === blankNum);
          if (targetIdx !== -1) jumpToQuestionIndex(targetIdx);
          break;
        }
        case 'jump-part': {
          if (!state.session) break;
          const p = Number(btn.getAttribute('data-part'));
          const targetIdx = state.session.questions.findIndex(q => q.part === p);
          if (targetIdx !== -1) jumpToQuestionIndex(targetIdx);
          break;
        }
        case 'set-font':
          state.passageFontSize = btn.getAttribute('data-size') || 'base';
          SafeStorage.setItem(STORAGE_KEYS.FONT_SIZE, state.passageFontSize);
          renderApp();
          break;
        case 'toggle-pause':
          if (state.session) {
            state.session.paused = !state.session.paused;
            renderApp();
          }
          break;
        case 'toggle-drawer':
          state.drawerOpen = !state.drawerOpen;
          renderApp();
          break;
        case 'submit-test':
          requestSubmitTest();
          break;
        case 'save-question-vocab': {
          if (!state.session) break;
          const q = state.session.questions[state.session.currentIndex];
          const vIdx = Number(btn.getAttribute('data-vidx'));
          if (q && q.vocab && q.vocab[vIdx]) {
            addWordToDeck(q.vocab[vIdx]);
          }
          break;
        }
        case 'save-report-vocab': {
          if (!state.lastReport) break;
          const qId = btn.getAttribute('data-qid');
          const vIdx = Number(btn.getAttribute('data-vidx'));
          const q = state.lastReport.questions.find(item => String(item.id) === String(qId));
          if (q && q.vocab && q.vocab[vIdx]) {
            addWordToDeck(q.vocab[vIdx]);
          }
          break;
        }
        case 'set-report-filter':
          state.reportFilter = btn.getAttribute('data-filter') || 'all';
          renderApp();
          break;
        case 'run-ai-generate':
          generateAIQuestions();
          break;
        case 'start-ai-test': {
          if (!state.aiGeneratedSet) break;
          const instant = btn.getAttribute('data-instant') === 'true';
          startTestSession({
            title: `AI 題組：${state.aiGeneratedSet.theme}`,
            questions: state.aiGeneratedSet.questions,
            passages: state.aiGeneratedSet.passage ? [state.aiGeneratedSet.passage] : [],
            durationMinutes: state.aiGeneratedSet.part === 3 ? 10 : 8,
            instantFeedback: instant,
            isOfficialFull: false
          });
          break;
        }
        case 'set-vocab-filter':
          state.vocabFilter = btn.getAttribute('data-filter') || 'all';
          state.flashcardIndex = 0;
          state.flashcardFlipped = false;
          renderApp();
          break;
        case 'flip-card':
          if (e.target.closest('[data-action="speak-card"]')) break;
          state.flashcardFlipped = !state.flashcardFlipped;
          renderApp();
          break;
        case 'speak-card':
          e.stopPropagation();
          speakWord(btn.getAttribute('data-word'));
          break;
        case 'prev-card':
          if (state.flashcardIndex > 0) {
            state.flashcardIndex -= 1;
            state.flashcardFlipped = false;
            renderApp();
          }
          break;
        case 'next-card':
          state.flashcardIndex += 1;
          state.flashcardFlipped = false;
          renderApp();
          break;
        case 'toggle-mastered': {
          const w = btn.getAttribute('data-word');
          const card = state.vocabDeck.find(v => v.word === w);
          if (card) {
            card.mastered = !card.mastered;
            saveVocabDeck();
            renderApp();
          }
          break;
        }
        case 'delete-card': {
          const w = btn.getAttribute('data-word');
          state.vocabDeck = state.vocabDeck.filter(v => v.word !== w);
          saveVocabDeck();
          renderApp();
          showToast(`已移除單字「${w}」`, 'info');
          break;
        }
        case 'start-mistake-drill':
          startMistakeDrill();
          break;
        case 'remove-mistake': {
          const qid = btn.getAttribute('data-qid');
          state.mistakes = state.mistakes.filter(m => String(m.id) !== String(qid));
          saveMistakes();
          renderApp();
          showToast('已從錯題本移出', 'success');
          break;
        }
        case 'clear-mistakes':
          openModal({
            title: '清空所有錯題紀錄？',
            bodyHtml: '<p>確定要清空錯題本中的全部題目嗎？此操作無法復原。</p>',
            confirmLabel: '確定清空',
            cancelLabel: '取消',
            confirmVariant: 'danger',
            onConfirm: () => {
              closeModal();
              state.mistakes = [];
              saveMistakes();
              renderApp();
              showToast('已清空錯題本', 'info');
            }
          });
          break;
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target && e.target.id === 'ai-part-select') {
        state.aiConfig.part = Number(e.target.value);
      } else if (e.target && e.target.id === 'ai-theme-select') {
        state.aiConfig.theme = e.target.value;
      }
    });

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

      if (e.key === 'Escape') {
        closeModal();
        return;
      }

      if (state.route === 'test' && state.session && !state.session.paused) {
        const key = e.key.toUpperCase();
        if (key === '1' || key === 'A') selectAnswerOption(0);
        else if (key === '2' || key === 'B') selectAnswerOption(1);
        else if (key === '3' || key === 'C') selectAnswerOption(2);
        else if (key === '4' || key === 'D') selectAnswerOption(3);
        else if (e.key === 'ArrowLeft') jumpToQuestionIndex(state.session.currentIndex - 1);
        else if (e.key === 'ArrowRight') jumpToQuestionIndex(state.session.currentIndex + 1);
        else if (key === 'F') toggleFlagCurrent();
      }
    });

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => {
      loadPersistedData();
      renderApp();
    });
  </script>
</body>
</html>
